[package]
name = "aifred-tasks-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
aifred-core = { version = "0.1.0", path = "../aifred-core" }
anyhow = "1.0.104"
rmcp = { version = "=3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
