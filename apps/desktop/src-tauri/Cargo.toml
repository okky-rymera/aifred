[package]
name = "aifred-desktop"
version = "0.1.1"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aifred-core = { version = "0.1.0", path = "../../../crates/aifred-core" }
aifred-embed = { version = "0.1.0", path = "../../../crates/aifred-embed" }
aifred-tools = { version = "0.1.0", path = "../../../crates/aifred-tools" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.54.1", features = ["sync", "rt-multi-thread", "time"] }

[dev-dependencies]
# Fake runtime for command tests: no real window is opened.
tauri = { version = "2", features = ["test"] }
