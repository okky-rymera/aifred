[package]
name = "aifred-desktop"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aifred-core = { version = "0.1.0", path = "../../../crates/aifred-core" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
# Fake runtime for command tests: no real window is opened.
tauri = { version = "2", features = ["test"] }
